[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = ""
  omit_hostname = false

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "my-org"
  bucket = "my-bucket"

[[inputs.mqtt_consumer]]
  servers = ["tcp://158.196.109.41:1883"]
  username = "student"
  password = "student"
  topics = [
    "esp-now/infra/sensors/+",
  ]
  qos = 0
  connection_timeout = "30s"
  data_format = "json_v2"
  


  # JSON parsing for sensors
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "sensors"
    timestamp_path = "ts"
    timestamp_format = "unix_us" # Assuming microseconds based on esp_timer_get_time()

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "id"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "relay"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "stype"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "link"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "batt"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "rssi"
      type = "integer"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "hops"
      type = "integer"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "active_us"
      type = "integer"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "plen"
      type = "integer"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "data"
      type = "string"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "seq"
      type = "integer"
