[platformio]
default_envs = esp32-c3-devkitm-1

[env]
platform = espressif32 @ 6.11.0
framework = espidf
monitor_speed = 115200
lib_extra_dirs = ../Shared
build_flags = 
    -I ../Shared/Common/include

; ─── Simulační firmware (původní, různé typy dle my_id % 4) ──────────────────
[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1

; ─── Firmware pro mé PCB s BME688 (SDA=GPIO01, SCL=GPIO03, batt=GPIO00) ─────────
; Nahraje se: pio run -e bme688-pcb --target upload
[env:bme688-pcb]
board = esp32-c3-devkitm-1
lib_deps =
    https://github.com/boschsensortec/BME68x_SensorAPI
build_flags =
    -I ../Shared/Common/include
    -DUSE_BME688
    -DBME688_SDA_PIN=1
    -DBME688_SCL_PIN=3
    -DBME688_BATT_ADC_CH=ADC_CHANNEL_0
    -DBME688_BATT_DIV_RATIO=2.0f